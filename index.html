```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milagro Stock 360</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f4f6f8;
    }

    header{
      background:#1f7a3f;
      color:white;
      padding:20px;
      text-align:center;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:20px;
    }

    .card{
      background:white;
      border-radius:12px;
      padding:20px;
      margin-bottom:20px;
      box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }

    h2{
      color:#1f7a3f;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:10px;
    }

    input, select, textarea, button{
      width:100%;
      padding:12px;
      border-radius:8px;
      border:1px solid #ccc;
      font-size:14px;
      box-sizing:border-box;
    }

    button{
      background:#1f7a3f;
      color:white;
      border:none;
      cursor:pointer;
      font-weight:bold;
    }

    button:hover{
      background:#15592d;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
    }

    th{
      background:#1f7a3f;
      color:white;
      padding:10px;
      font-size:14px;
    }

    td{
      border-bottom:1px solid #ddd;
      padding:10px;
      font-size:13px;
    }
  </style>
</head>

<body>

<header>
  <h1>MILAGRO STOCK 360</h1>
  <p>Controle de Estoque de Sementes</p>
</header>

<div class="container">

  <div class="card">
    <h2>Cadastro de Sementes</h2>

    <div class="grid">
      <input type="text" id="variedade" placeholder="Variedade">
      <input type="text" id="lote" placeholder="Lote">
      <input type="text" id="quadra" placeholder="Quadra">

      <select id="galpao">
        <option value="">Selecione o Galpão</option>
        <option>Galpão 1</option>
        <option>Galpão 2</option>
        <option>Galpão 3</option>
        <option>Galpão 4</option>
      </select>

      <input type="number" id="quantidade" placeholder="Quantidade">
      <input type="text" id="pureza" placeholder="Pureza (%)">
      <input type="text" id="tz" placeholder="TZ (%)">

      <select id="status">
        <option>Armazenada</option>
        <option>Pronta para venda</option>
        <option>Vendida</option>
        <option>Bloqueada</option>
      </select>
    </div>

    <br>

    <textarea id="observacao" rows="4" placeholder="Contaminação, ajustes ou observações"></textarea>

    <br><br>

    <button onclick="salvarSemente()">
      Salvar Semente
    </button>
  </div>

  <div class="card">
    <h2>Estoque de Sementes</h2>

    <table>
      <thead>
        <tr>
          <th>Variedade</th>
          <th>Lote</th>
          <th>Quadra</th>
          <th>Galpão</th>
          <th>Qtd</th>
          <th>Pureza</th>
          <th>TZ</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="tabelaEstoque"></tbody>
    </table>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyALJ0APzmiU3tTmv6f3kMGYQX1Oc61t0F4",
  authDomain: "milagro-172c5.firebaseapp.com",
  databaseURL: "https://milagro-172c5-default-rtdb.firebaseio.com",
  projectId: "milagro-172c5",
  storageBucket: "milagro-172c5.firebasestorage.app",
  messagingSenderId: "923027654375",
  appId: "1:923027654375:web:d9e24bec8e48d304438442"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.salvarSemente = function(){

  const dados = {
    variedade: document.getElementById("variedade").value,
    lote: document.getElementById("lote").value,
    quadra: document.getElementById("quadra").value,
    galpao: document.getElementById("galpao").value,
    quantidade: document.getElementById("quantidade").value,
    pureza: document.getElementById("pureza").value,
    tz: document.getElementById("tz").value,
    status: document.getElementById("status").value,
    observacao: document.getElementById("observacao").value,
    dataCadastro: new Date().toLocaleString("pt-BR")
  };

  push(ref(db, "sementes"), dados);

  alert("Semente salva com sucesso!");

  limparCampos();
}

function limparCampos(){

  document.getElementById("variedade").value = "";
  document.getElementById("lote").value = "";
  document.getElementById("quadra").value = "";
  document.getElementById("galpao").value = "";
  document.getElementById("quantidade").value = "";
  document.getElementById("pureza").value = "";
  document.getElementById("tz").value = "";
  document.getElementById("status").value = "Armazenada";
  document.getElementById("observacao").value = "";
}

function carregarEstoque(){

  const tabela = document.getElementById("tabelaEstoque");

  onValue(ref(db, "sementes"), (snapshot)=>{

    tabela.innerHTML = "";

    snapshot.forEach((item)=>{

      const s = item.val();

      tabela.innerHTML += `
        <tr>
          <td>${s.variedade || ""}</td>
          <td>${s.lote || ""}</td>
          <td>${s.quadra || ""}</td>
          <td>${s.galpao || ""}</td>
          <td>${s.quantidade || ""}</td>
          <td>${s.pureza || ""}</td>
          <td>${s.tz || ""}</td>
          <td>${s.status || ""}</td>
        </tr>
      `;
    });
  });
}

carregarEstoque();

</script>

</body>
</html>
