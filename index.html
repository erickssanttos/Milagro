<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milagro Stock 360</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #1f7a3f;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 1100px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      color: #1f7a3f;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      background: #1f7a3f;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #155c2f;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #1f7a3f;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>Milagro Stock 360</h1>
  <p>Controle de Sementes, Galpões, Estoque e Vendas</p>
</header>

<main>

  <section class="card">
    <h2>Cadastro de Sementes</h2>

    <div class="grid">
      <input id="variedade" placeholder="Variedade da semente">
      <input id="lote" placeholder="Lote">
      <input id="quadra" placeholder="Quadra">
      <select id="galpao">
        <option value="">Selecione o galpão</option>
        <option>Galpão 1</option>
        <option>Galpão 2</option>
        <option>Galpão 3</option>
        <option>Galpão 4</option>
      </select>
      <input id="quantidade" type="number" placeholder="Quantidade / Sacos">
      <input id="pureza" placeholder="Pureza (%)">
      <input id="tz" placeholder="TZ (%)">
      <select id="status">
        <option value="Armazenada">Armazenada</option>
        <option value="Pronta para venda">Pronta para venda</option>
        <option value="Vendida">Vendida</option>
        <option value="Bloqueada">Bloqueada</option>
      </select>
    </div>

    <textarea id="observacao" placeholder="Descrição de contaminação, ajustes ou observações"></textarea>

    <button onclick="salvarSemente()">Salvar Semente</button>
  </section>

  <section class="card">
    <h2>Registrar Venda</h2>

    <div class="grid">
      <input id="clienteVenda" placeholder="Cliente">
      <input id="sementeVenda" placeholder="Semente / Lote">
      <input id="quantidadeVenda" type="number" placeholder="Quantidade vendida">
      <input id="dataVenda" type="date">
    </div>

    <button onclick="salvarVenda()">Salvar Venda</button>
  </section>

  <section class="card">
    <h2>Estoque de Sementes</h2>
    <table>
      <thead>
        <tr>
          <th>Variedade</th>
          <th>Lote</th>
          <th>Quadra</th>
          <th>Galpão</th>
          <th>Qtd</th>
          <th>Pureza</th>
          <th>TZ</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tabelaEstoque"></tbody>
    </table>
  </section>

</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "COLE_AQUI",
    authDomain: "COLE_AQUI",
    databaseURL: "https://milagro-172c5-default-rtdb.firebaseio.com",
    projectId: "milagro-172c5",
    storageBucket: "COLE_AQUI",
    messagingSenderId: "COLE_AQUI",
    appId: "COLE_AQUI"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.salvarSemente = function () {
    const dados = {
      variedade: document.getElementById("variedade").value,
      lote: document.getElementById("lote").value,
      quadra: document.getElementById("quadra").value,
      galpao: document.getElementById("galpao").value,
      quantidade: document.getElementById("quantidade").value,
      pureza: document.getElementById("pureza").value,
      tz: document.getElementById("tz").value,
      status: document.getElementById("status").value,
      observacao: document.getElementById("observacao").value,
      dataCadastro: new Date().toLocaleString("pt-BR")
    };

    push(ref(db, "sementes"), dados);
    alert("Semente salva com sucesso!");

    document.querySelectorAll("input, textarea").forEach(campo => campo.value = "");
  };

  window.salvarVenda = function () {
    const venda = {
      cliente: document.getElementById("clienteVenda").value,
      semente: document.getElementById("sementeVenda").value,
      quantidade: document.getElementById("quantidadeVenda").value,
      data: document.getElementById("dataVenda").value,
      dataRegistro: new Date().toLocaleString("pt-BR")
    };

    push(ref(db, "vendas"), venda);
    alert("Venda registrada com sucesso!");
  };

  function carregarEstoque() {
    const tabela = document.getElementById("tabelaEstoque");

    onValue(ref(db, "sementes"), (snapshot) => {
      tabela.innerHTML = "";

      snapshot.forEach((item) => {
        const s = item.val();

        tabela.innerHTML += `
          <tr>
            <td>${s.variedade || ""}</td>
            <td>${s.lote || ""}</td>
            <td>${s.quadra || ""}</td>
            <td>${s.galpao || ""}</td>
            <td>${s.quantidade || ""}</td>
            <td>${s.pureza || ""}</td>
            <td>${s.tz || ""}</td>
            <td>${s.status || ""}</td>
          </tr>
        `;
      });
    });
  }

  carregarEstoque();
</script>

</body>
</html>
